# =============================================================================
# NEXUS — Google Cloud Agent Operations
# Cloud Build Pipeline Configuration
# =============================================================================

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE'

substitutions:
  _REGION: europe-west3
  _SERVICE_NAME: nexus-console-dev
  _REPO_NAME: nexus-console-docker
  _IMAGE_NAME: nexus-console
  _ENVIRONMENT: dev
  _DB_INSTANCE_NAME: nexus-db
  _RUNTIME_SERVICE_ACCOUNT: nexus-console-run-sa@$PROJECT_ID.iam.gserviceaccount.com

steps:
  # Step 1: Install dependencies
  - name: 'node:20-alpine'
    id: 'install-dependencies'
    entrypoint: 'npm'
    args: ['ci']
    waitFor: ['-']

  # Step 2: Run TypeScript type checking
  - name: 'node:20-alpine'
    id: 'typecheck'
    entrypoint: 'npm'
    args: ['exec', 'tsc', '--', '--noEmit']
    waitFor: ['install-dependencies']

  # Step 3: Run linting
  - name: 'node:20-alpine'
    id: 'lint'
    entrypoint: 'npm'
    args: ['run', 'lint']
    waitFor: ['install-dependencies']

  # Step 4: Build Next.js application
  - name: 'node:20-alpine'
    id: 'build'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      - 'DATABASE_URL=postgresql://placeholder'
      - 'NODE_ENV=production'
    waitFor: ['typecheck', 'lint']

  # Step 5: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:latest'
      - '.'
    waitFor: ['build']

  # Step 6: Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$SHORT_SHA'
    waitFor: ['build-docker']

  # Step 7: Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:latest'
    waitFor: ['push-docker']

  # Step 8: Deploy to Cloud Run and record its canonical URL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        CONNECTION_NAME=$$(gcloud sql instances describe "${_DB_INSTANCE_NAME}" --project="$PROJECT_ID" --format='value(connectionName)')
        gcloud run deploy "${_SERVICE_NAME}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$SHORT_SHA" \
          --platform=managed \
          --allow-unauthenticated \
          --service-account="${_RUNTIME_SERVICE_ACCOUNT}" \
          --add-cloudsql-instances="$${CONNECTION_NAME}" \
          --set-env-vars="NODE_ENV=production,PROJECT_ID=$PROJECT_ID,VERTEX_AI_LOCATION=${_REGION}" \
          --set-secrets="DATABASE_URL=${_SERVICE_NAME}-database-url:latest"
        gcloud run services describe "${_SERVICE_NAME}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --format='value(status.url)' > /workspace/service-url
    waitFor: ['push-docker']

  # Database migrations must run as a dedicated, approval-gated Cloud Run Job
  # built with migration tooling. They must not mutate the web service command.

  # Step 9: Health check the deployed service URL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'healthcheck'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        SERVICE_URL=$$(cat /workspace/service-url)
        curl -f --retry 3 --retry-delay 10 "$${SERVICE_URL}/api/health"
    waitFor: ['deploy']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:latest'

timeout: '1800s'

# Tags for build organization
tags:
  - nexus-console
  - nextjs
  - production
  - $_ENVIRONMENT
